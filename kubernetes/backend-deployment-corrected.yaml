apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: car-finder-sa
      containers:
      - name: backend
        image: us-central1-docker.pkg.dev/jmacleod-42/car-finder-agent-repo/backend:v18
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: OLLAMA_API_URL
          value: "http://ollama.ollama.svc.cluster.local:11434/api/generate"
        - name: DATABASE_PATH
          value: "/app/database/car_finder.db"
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: car-finder-db
          mountPath: "/app/database"
      volumes:
      - name: car-finder-db
        persistentVolumeClaim:
          claimName: car-finder-db-pvc
